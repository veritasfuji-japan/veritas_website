name: Website CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  website-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run public claims guardrail
        run: npm run check:claims

      - name: Run hidden Unicode guardrail
        run: npm run check:unicode

      - name: Run fixture reference guardrail
        run: npm run check:fixtures

      - name: Build website
        run: npm run build

      - name: Run route HTML guardrail
        run: npm run check:route-html

      - name: Run public site integrity guardrail
        run: npm run check:site-integrity
